name: CI

on:
  # 所有分支推送都运行（功能分支合并前即可看到结果）；PR 覆盖来自 fork 的贡献
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsgo typecheck, biome, ast-grep rules, tailwind CSS check, smoke build
      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sceneflow
          POSTGRES_PASSWORD: sceneflow_test
          POSTGRES_DB: sceneflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sceneflow -d sceneflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://sceneflow:sceneflow_test@127.0.0.1:5432/sceneflow_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[dev]"

      - name: Ruff
        run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .

      - name: Pytest
        run: uv run --no-sync pytest -q
